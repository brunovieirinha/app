# VIEIRINHA040726 — workflow temporário para importar as fotografias do
# Media Manager do Wix (static.wixstatic.com) para o repositório, porque
# o ambiente de desenvolvimento não tem acesso de rede a esse domínio.
# Fase 2: hero a cores. Pode ser removido depois de as imagens estarem no repositório.
name: Importar imagens do Wix

on:
  push:
    branches: [claude/ferracuti-static-site-lxe83w]

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descarregar imagens
        run: |
          set -euo pipefail
          if [ -f ferracuti-site/img/hero.jpg ]; then
            echo "Hero já importado — nada a fazer."
            exit 0
          fi
          baixar() {
            curl -fsSL --retry 3 -o "$1" \
              "https://static.wixstatic.com/media/$2/v1/fit/w_$3,h_$3,q_82/foto.jpg"
          }
          # Versões a cores do ensaio fotográfico (hero)
          baixar ferracuti-site/img/hero.jpg "ccb978_bb08ef829b14480382a63b96305abaa9~mv2.jpg" 2200
          baixar ferracuti-site/img/_candidatas/hero-d.jpg "ccb978_a3e1f8d2bade4f5b88936314e50b999b~mv2.jpg" 2200
          baixar ferracuti-site/img/_candidatas/hero-e.jpg "ccb978_88903f9d94fd412c8a179129e3324a23~mv2.jpg" 2200
          ls -la ferracuti-site/img

      - name: Commit e push
        run: |
          set -euo pipefail
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ferracuti-site/img
            git commit -m "Importar fotografia de hero a cores a partir do Wix"
            git push
          else
            echo "Sem alterações."
          fi
